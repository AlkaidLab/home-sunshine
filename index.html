<!DOCTYPE html>
<html lang="zh-CN" data-theme="gura">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瑶光流梦 - 让游戏串流更优雅</title>
    <meta name="description" content="瑶光流梦是基于官方分支修改的游戏串流解决方案，提供HDR支持、虚拟显示器、远程麦克风等高级功能。">
    <meta name="keywords" content="AlkaidLab,瑶光流梦,游戏串流,Moonlight,HDR,虚拟显示器,游戏流媒体">
    
    <!-- Favicon -->
    <link rel="icon" type="image/webp" sizes="256x256" href="/favicon.webp">
    <link rel="apple-touch-icon" sizes="180x180" href="/log.png">
    <link rel="shortcut icon" href="/favicon.webp">
    
    <!-- Theme Color - Gura Blue -->
    <meta name="theme-color" content="#39c5bb">
    
    <!-- Google Fonts - Inter for modern look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Preload critical styles -->
    <style>
      /* Critical CSS for initial render - prevent flash */
      :root,
      [data-theme="gura"] {
        --primary-color: #39c5bb;
        --background-primary: #ffffff;
        --background-secondary: #f8fafc;
        --text-primary: #1e293b;
      }
      
      [data-theme="chocolate"] {
        --primary-color: #d4a574;
        --background-primary: #1a1410;
        --background-secondary: #231c16;
        --text-primary: #f5f0eb;
      }
      
      * {
        box-sizing: border-box;
      }
      
      body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: var(--background-primary);
        color: var(--text-primary);
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      
      #app {
        min-height: 100vh;
      }
      
    </style>
    
    <script>
      // Apply saved theme immediately to prevent flash
      (function() {
        const savedTheme = localStorage.getItem('theme') || 'gura';
        document.documentElement.setAttribute('data-theme', savedTheme);

        // Play the opening sequence on every full page load without blocking SSG content.
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!prefersReducedMotion) {
          document.documentElement.setAttribute('data-intro', 'active');
          window.addEventListener('DOMContentLoaded', () => {
            window.setTimeout(() => {
              document.documentElement.removeAttribute('data-intro');
            }, 2700);
          }, { once: true });
        }
        
        // Update theme-color meta tag
        const themeColor = savedTheme === 'chocolate' ? '#d4a574' : '#39c5bb';
        const metaThemeColor = document.querySelector('meta[name="theme-color"]');
        if (metaThemeColor) {
          metaThemeColor.setAttribute('content', themeColor);
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"><!--ssg-outlet--></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
